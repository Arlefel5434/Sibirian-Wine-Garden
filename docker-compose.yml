services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - ./:/var/www/html                 # Монтирует код с ПК
            - /var/www/html/public/build       # ВАЖНО: защищает скомпилированный Vite от затирания с ПК
        environment:
            CACHE_STORE: redis
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
        depends_on:
            db:
                condition: service_started
            redis:
                condition: service_healthy

    nginx:
        image: nginx:latest
        ports:
            - "8888:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        volumes_from:
            - app
        depends_on:
            - app

    frontend:
        image: node:24-alpine
        working_dir: /var/www/html
        command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
        ports:
            - "5180:5173"
        volumes:
            - ./:/var/www/html
            - node_modules:/var/www/html/node_modules

    db:
        image: postgres:18
        environment:
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
        ports:
            - "5439:5432"
        volumes:
            - pgdata:/var/lib/postgresql

    redis:
        image: redis:8-alpine
        command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lfu
        ports:
            - "127.0.0.1:6380:6379"
        volumes:
            - redisdata:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

volumes:
    pgdata:
    node_modules:
    redisdata:
