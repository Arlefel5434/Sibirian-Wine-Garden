services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - ./:/var/www/html                 # Монтирует код с ПК
            - /var/www/html/public/build       # ВАЖНО: защищает скомпилированный Vite от затирания с ПК
        environment:
            CACHE_STORE: redis
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
        depends_on:
            db:
                condition: service_started
            redis:
                condition: service_healthy

    nginx:
        image: nginx:latest
        ports:
            - "8888:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        volumes_from:
            - app
        depends_on:
            - app

    frontend:
        image: node:24-alpine
        working_dir: /var/www/html
        command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
        ports:
            - "5180:5173"
        volumes:
            - ./:/var/www/html
            - node_modules:/var/www/html/node_modules

    db:
        image: postgres:18
        environment:
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
        ports:
            - "5439:5432"
        volumes:
            - pgdata:/var/lib/postgresql

    redis:
        image: redis:8-alpine
        command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lfu
        ports:
            - "127.0.0.1:6380:6379"
        volumes:
            - redisdata:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    rabbitmq:
        image: rabbitmq:4.4.0-management-alpine
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-wine}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
        ports:
            - "127.0.0.1:5673:5672"
            - "127.0.0.1:15672:15672"
        volumes:
            - rabbitmqdata:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 5s
            timeout: 5s
            retries: 12

    rabbitmq-setup:
        build:
            context: .
            dockerfile: Dockerfile
        command: php artisan rabbitmq:setup
        volumes:
            - ./:/var/www/html
        environment:
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            RABBITMQ_USER: ${RABBITMQ_USER:-wine}
            RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
            RABBITMQ_VHOST: /
        depends_on:
            rabbitmq:
                condition: service_healthy

    order-worker:
        build:
            context: .
            dockerfile: Dockerfile
        command: php artisan rabbitmq:consume rabbitmq --queue=orders.process --prefetch-count=1 --sleep=1 --tries=3 --timeout=30 --max-time=3600
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
        environment:
            CACHE_STORE: redis
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            RABBITMQ_USER: ${RABBITMQ_USER:-wine}
            RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
            RABBITMQ_VHOST: /
        depends_on:
            rabbitmq-setup:
                condition: service_completed_successfully
            db:
                condition: service_started
            redis:
                condition: service_healthy

    email-worker:
        build:
            context: .
            dockerfile: Dockerfile
        command: php artisan rabbitmq:consume rabbitmq --queue=notifications.email --prefetch-count=1 --sleep=1 --tries=5 --timeout=30 --max-time=3600
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
        environment:
            CACHE_STORE: redis
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            RABBITMQ_USER: ${RABBITMQ_USER:-wine}
            RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
            RABBITMQ_VHOST: /
        depends_on:
            rabbitmq-setup:
                condition: service_completed_successfully
            db:
                condition: service_started
            redis:
                condition: service_healthy

    delivery-worker:
        build:
            context: .
            dockerfile: Dockerfile
        command: php artisan rabbitmq:consume rabbitmq --queue=delivery.submit --prefetch-count=1 --sleep=1 --tries=5 --timeout=30 --max-time=3600
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
        environment:
            CACHE_STORE: redis
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            RABBITMQ_USER: ${RABBITMQ_USER:-wine}
            RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
            RABBITMQ_VHOST: /
        depends_on:
            rabbitmq-setup:
                condition: service_completed_successfully
            db:
                condition: service_started
            redis:
                condition: service_healthy

    outbox-publisher:
        build:
            context: .
            dockerfile: Dockerfile
        command: sh -c "while true; do php artisan outbox:publish --limit=100 || true; sleep 1; done"
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
        environment:
            CACHE_STORE: redis
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            RABBITMQ_HOST: rabbitmq
            RABBITMQ_PORT: 5672
            RABBITMQ_USER: ${RABBITMQ_USER:-wine}
            RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
            RABBITMQ_VHOST: /
        depends_on:
            rabbitmq-setup:
                condition: service_completed_successfully
            db:
                condition: service_started
            redis:
                condition: service_healthy

volumes:
    pgdata:
    node_modules:
    redisdata:
    rabbitmqdata:
